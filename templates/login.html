{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block public_content %}
<div class="auth-wrapper">
  <div class="auth-card">
      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo" style="height: 48px; width: 48px; border-radius: 12px; object-fit: cover;">
        <h3 class="mt-2 fw-bold d-inline-block align-middle ms-2">Login</h3>
      </div>
      <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
